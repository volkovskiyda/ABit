#Kotlin
kotlin.code.style=official
# The Kotlin compiler runs in its own daemon and inherits org.gradle.jvmargs when this is unset,
# which would silently claim a second 4g on top of Gradle's. Pinned so the ceiling is 7g, not 8g.
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# Named per option rather than by warning type: android.sync.suppressAgpWarnings silences the
# message for every unsupported option, including ones added later that nobody has weighed. The
# self-reference is not a typo — the property is itself an unsupported option, so leaving it out of
# its own list only trades one warning for another.
#
# Opens the screenshotTest source set for Compose Preview Screenshot Testing. Experimental flag
# required by the (alpha) com.android.compose.screenshot plugin; see app/android/build.gradle.kts.
android.experimental.enableScreenshotTest=true
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.experimental.enableScreenshotTest
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
