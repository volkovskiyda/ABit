[versions]
# ---- Build toolchain -------------------------------------------------------------------------
agp = "9.4.0"
# Pinned back from 2.4.20, and it is load-bearing: the Kotzilla Gradle plugin (2.3.6) registers its
# Compose instrumentation through the K1 `ComponentRegistrar` interface that Kotlin 2.4.20 deleted.
# Read the kotzilla block in app/shared/build.gradle.kts before bumping this.
kotlin = "2.4.10"
# Paired to the Kotlin version above; KSP releases track Kotlin releases one-for-one.
ksp = "2.3.12"
# The bytecode every module compiles to. Read by the convention plugins, never hardcoded.
jvmTarget = "17"
# The JDK Gradle provisions to run the build (also gradle/gradle-daemon-jvm.properties).
jvmToolchain = "21"
androidCompileSdk = "37"
# Android 11. Wear OS 3+ sits at 30 too, so phone and watch share one floor.
androidMinSdk = "30"
androidTargetSdk = "37"

# ---- Compose ---------------------------------------------------------------------------------
composeMultiplatform = "1.12.0"
# The stable JetBrains material3 line, deliberately not the alpha that moves with CMP previews.
composeMaterial3 = "1.9.0"
# The adaptive line moves on its own schedule and is not pinned to composeMaterial3. Verified
# 2026-09-15 that 1.2.0 publishes a `wasm:js` variant — a missing wasm variant fails only at link
# time, long after the dependency resolves.
composeAdaptive = "1.2.0"

# ---- AndroidX, multiplatform builds ------------------------------------------------------------
androidxLifecycle = "2.11.0"
# The Navigation 3 runtime is Google's (androidx.navigation3) and the UI is JetBrains' KMP port
# (org.jetbrains.androidx.navigation3). They release on separate cadences and cannot share a ref.
androidxNavigation3 = "1.1.7"
composeNavigation3 = "1.1.1"
androidxRoom = "3.0.3"
androidxSqlite = "2.7.1"
androidxDataStore = "1.2.1"

# ---- AndroidX, Android only --------------------------------------------------------------------
androidxActivity = "1.13.0"
androidxCore = "1.19.0"
androidxCoreSplashscreen = "1.2.0"
androidxCredentials = "1.6.0"
googleId = "1.2.0"
androidxTracing = "2.0.2"
androidxProfileinstaller = "1.4.1"

# ---- Wear OS -----------------------------------------------------------------------------------
wearCompose = "1.6.2"
# The tile is ProtoLayout, not Compose: a tile is rendered by the system launcher in another process,
# so it is a serialized layout tree rather than a composition. Nothing from core:designsystem's
# composables can be reused there — only its Compose-free tokens and formatting.
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
# CallbackToFutureAdapter: a TileService answers with a ListenableFuture, and this is the smallest
# way to complete one from a coroutine without pulling in Guava or Horologist.
androidxConcurrentFutures = "1.3.0"
wearToolingPreview = "1.0.0"

# ---- DI and observability ----------------------------------------------------------------------
koin = "4.2.2"
kotzilla = "2.3.6"

# ---- Firebase ----------------------------------------------------------------------------------
# The BoM pins every native SDK member, so firebase-crashlytics and firebase-perf carry no version.
firebaseBom = "34.19.0"
# The multiplatform bindings. 3.0.0-alpha02 (2026-09-03) is the first release with a wasmJs target,
# which is why an alpha is accepted here: the stable 2.7.0 line cannot build the web app at all.
gitliveFirebase = "3.0.0-alpha02"
gitliveFirebaseJavaSdk = "0.6.3"
googleServices = "4.5.0"
firebaseCrashlyticsPlugin = "3.0.8"
firebasePerfPlugin = "2.0.2"

# ---- Kotlin ecosystem --------------------------------------------------------------------------
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxImmutable = "0.5.2"
kotlinxBrowser = "0.5.0"
okio = "3.18.2"

# ---- Test --------------------------------------------------------------------------------------
junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
# Declared only to lift the version Compose ui-test asks for: 3.5.0 reflects on an InputManager
# method that Android 16 images dropped, which takes down every touch-injecting test.
androidxEspresso = "3.7.0"
androidxUiAutomator = "2.4.0"
androidxBenchmark = "1.5.0"
androidxBaselineProfile = "1.5.0"
composeScreenshot = "0.0.1-alpha16"
# The Android Compose BoM, for the ui-test artifacts only: those are AndroidX rather than JetBrains
# Compose Multiplatform, and pairing them by hand with the Compose the app resolves is how versions
# drift apart.
androidxComposeBom = "2026.09.00"
turbine = "1.2.1"

# ---- Static analysis ---------------------------------------------------------------------------
detekt = "1.23.8"
# The ktlint engine, pinned separately from the Gradle plugin that runs it: left unset the plugin
# picks its own default, which moves on every plugin bump and reformats the codebase with it.
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

[libraries]
# ---- Gradle plugins as libraries, for build-logic's compile classpath ---------------------------
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "androidxRoom" }
googleServices-gradlePlugin = { module = "com.google.gms:google-services", version.ref = "googleServices" }
firebaseCrashlytics-gradlePlugin = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
firebasePerf-gradlePlugin = { module = "com.google.firebase:perf-plugin", version.ref = "firebasePerfPlugin" }

# ---- Compose Multiplatform ---------------------------------------------------------------------
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-toolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# Adaptive layout. `adaptive` carries the window-size classes, `adaptive-layout` the pane scaffolds
# (ListDetailPaneScaffold) and `adaptive-navigation` the navigator that makes the system back gesture
# collapse a detail pane before it pops a destination. The navigation suite is what renders a bottom
# bar on a phone and a rail on a tablet from one declaration, and it ships in the material3 line.
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
compose-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "composeAdaptive" }
compose-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "composeAdaptive" }
compose-material3-adaptive-navigationSuite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeMaterial3" }

# ---- AndroidX, multiplatform -------------------------------------------------------------------
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "composeNavigation3" }
androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidxRoom" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
# The browser has no native SQLite; this is the Web Worker driver.
androidx-sqlite-web = { module = "androidx.sqlite:sqlite-web", version.ref = "androidxSqlite" }
androidx-datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "androidxDataStore" }

# ---- AndroidX, Android only --------------------------------------------------------------------
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-playServicesAuth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "androidxTracing" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileinstaller" }

# ---- Wear OS -----------------------------------------------------------------------------------
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "androidxConcurrentFutures" }
wear-tiles = { module = "androidx.wear.tiles:tiles", version.ref = "wearTiles" }
wear-tiles-tooling = { module = "androidx.wear.tiles:tiles-tooling", version.ref = "wearTiles" }
wear-tiles-toolingPreview = { module = "androidx.wear.tiles:tiles-tooling-preview", version.ref = "wearTiles" }
wear-protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "wearProtolayout" }
wear-protolayout-material3 = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "wearProtolayout" }
wear-protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "wearProtolayout" }
wear-compose-uiTooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wearCompose" }
wear-toolingPreview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }

# ---- DI ----------------------------------------------------------------------------------------
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }
koin-test = { module = "io.insert-koin:koin-test" }

# ---- Observability -----------------------------------------------------------------------------
kotzilla-sdk = { module = "io.kotzilla:kotzilla-sdk", version.ref = "kotzilla" }

# ---- Firebase ----------------------------------------------------------------------------------
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-common = { module = "com.google.firebase:firebase-common" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
gitlive-firebase-app = { module = "dev.gitlive:firebase-app", version.ref = "gitliveFirebase" }
# The JVM half of GitLive: a port of the Firebase Android SDK, versioned independently of the
# bindings above. Only the desktop target needs it.
gitlive-firebase-java-sdk = { module = "dev.gitlive:firebase-java-sdk", version.ref = "gitliveFirebaseJavaSdk" }
gitlive-firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitliveFirebase" }
gitlive-firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitliveFirebase" }

# ---- Kotlin ecosystem --------------------------------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }
# `window`, `navigator`, `localStorage` and `Worker` on Kotlin/Wasm.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }

# ---- Test --------------------------------------------------------------------------------------
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspresso" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiAutomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "composeScreenshot" }

[plugins]
