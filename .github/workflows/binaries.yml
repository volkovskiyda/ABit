name: Binaries

# Every artefact a published release carries, built once and uploaded under one naming scheme.
#
# It exists as a reusable workflow because both delivery paths need exactly the same binaries and
# only differ in what they do with them: ci.yml publishes a pre-release on every green main push,
# release.yml publishes a curated release on a tag. Duplicating these three jobs across the two
# workflows would mean fixing every packaging change twice.
#
# Callers pass the version in pieces rather than assembled, because the Gradle build wants them
# apart (-PbaseVersion, -PbuildNumber) and the file names want them together. Computing the commit
# count here would force fetch-depth: 0 on all three jobs; the caller already has it.
on:
  workflow_call:
    inputs:
      base-version:
        description: The version base without its leading "v" — 1.3 for the tag v1.3.
        required: true
        type: string
      build-number:
        description: The versionCode, which is the commit count.
        required: true
        type: string

jobs:
  # The phone and the watch in one job: they share a keystore, a google-services.json and a Gradle
  # invocation, so splitting them would restore the secrets and warm the daemon twice for nothing.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true   # the release build packages the LFS-tracked baseline profile, and a pointer
                      # file would fail the ART profile step
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore secrets
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KOTZILLA_JSON_BASE64: ${{ secrets.KOTZILLA_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          # Optional, and the script says so: the client does not exist yet.
          OAUTH_PROPERTIES_BASE64: ${{ secrets.OAUTH_PROPERTIES_BASE64 }}
        run: scripts/restore-secrets.sh

      - name: Build the signed release APKs
        run: |
          ./gradlew :app:android:assembleRelease :app:wear:assembleRelease \
            -PbuildNumber="${{ inputs.build-number }}" \
            -PbaseVersion="${{ inputs.base-version }}"

      # The mappings are not optional: R8 is on, so without the file from this exact build no crash
      # report from it can be read. Crashlytics holds its own copy; these are for anyone reading a
      # stack trace out of a GitHub issue. Publishing one per build is the reason every main push
      # gets its own release rather than overwriting a single rolling one.
      - name: Collect the artifacts
        run: |
          set -euo pipefail
          V="${{ inputs.base-version }}.${{ inputs.build-number }}"
          mkdir -p artifacts
          cp app/android/build/outputs/apk/release/android-release.apk "artifacts/abit-$V.apk"
          cp app/wear/build/outputs/apk/release/wear-release.apk "artifacts/abit-wear-$V.apk"
          cp app/android/build/outputs/mapping/release/mapping.txt "artifacts/mapping-android-$V.txt"
          cp app/wear/build/outputs/mapping/release/mapping.txt "artifacts/mapping-wear-$V.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: artifacts/*
          if-no-files-found: error

  # macOS is the only runner that can package or notarize a DMG.
  desktop:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      # The Google OAuth client the desktop sign-in flow uses. Gated on the secret existing, like the
      # Apple certificate below and for the same kind of reason: the client needs the OAuth consent
      # screen configured in the Google Cloud console, which nobody can do headlessly. Without it the
      # DMG still packages and runs — its popover reports Google sign-in unavailable.
      # scripts/restore-secrets.sh restores the same file for the Android job.
      - name: Restore the desktop OAuth client
        env:
          OAUTH_PROPERTIES_BASE64: ${{ secrets.OAUTH_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${OAUTH_PROPERTIES_BASE64:-}" ]; then
            echo "No OAuth client configured — the DMG will report Google sign-in unavailable."
            exit 0
          fi
          printf '%s' "$OAUTH_PROPERTIES_BASE64" | base64 -d > oauth.properties

      # Signing is gated on the secrets existing, because the Apple Developer Program is not paid for
      # yet. With no certificate the DMG is built unsigned and macOS shows the Gatekeeper warning; the
      # release notes say so. When the certificate exists, adding these three secrets is the whole
      # change — no code moves.
      # The condition is on env rather than on `secrets` directly: GitHub does not allow the
      # secrets context inside an `if`, so the value has to be carried through the environment.
      - name: Import the Apple signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "No Apple signing certificate configured — the DMG will be unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # notarizeReleaseDmg when the Apple secrets are present, packageReleaseDmg when they are not.
      # Notarization submits the bundle to Apple and waits, which is why this job's timeout is
      # generous. Both are the `release` build type, the one ProGuard shrinks — `packageDmg` would
      # ship the unminified bundle, which is 25 MB larger and is not what CI proved on this commit.
      - name: Package the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          set -euo pipefail
          TASK=packageReleaseDmg
          if [ -n "${NOTARIZATION_TEAM_ID:-}" ]; then TASK=notarizeReleaseDmg; fi
          echo "Running :app:desktop:$TASK"
          ./gradlew ":app:desktop:$TASK" \
            -PbuildNumber="${{ inputs.build-number }}" \
            -PbaseVersion="${{ inputs.base-version }}"

      # jpackage names it "<packageName>-<packageVersion>.dmg", which is already ABit-1.3.348.dmg —
      # the same version the APKs carry, so nothing needs renaming here. The directory is
      # main-release rather than main because the task is the release-build-type one.
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-release
          path: app/desktop/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  # The web app ships to Firebase Hosting, but the release carries the same bundle as a zip so that
  # every platform in the release is downloadable from one page — and so the publish job can deploy
  # the exact bytes it published rather than building the app a second time.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: |
          ./gradlew :app:web:wasmJsBrowserDistribution \
            -PbuildNumber="${{ inputs.build-number }}" \
            -PbaseVersion="${{ inputs.base-version }}"

      # Zipped from inside the distribution directory, so it unpacks as index.html + assets rather
      # than as a productionExecutable/ folder. The publish job relies on that: it unzips straight
      # into the path firebase.json serves.
      - name: Zip the web bundle
        run: |
          set -euo pipefail
          V="${{ inputs.base-version }}.${{ inputs.build-number }}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd app/web/build/dist/wasmJs/productionExecutable
          zip -qr "$GITHUB_WORKSPACE/artifacts/abit-web-$V.zip" .

      - uses: actions/upload-artifact@v5
        with:
          name: web-release
          path: artifacts/*
          if-no-files-found: error
