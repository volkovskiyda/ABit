name: Release

# A pushed v* tag publishes the curated release: the same four platforms ci.yml builds, carrying a
# v<version> title and a second Test Lab matrix on three devices ci.yml never runs. Every green main
# push publishes a release too — ci.yml tags those build-<versionCode> — and both are full releases,
# so what separates the two channels is what a build is tested on and what it is called, not a flag.
# `releases/latest` follows whichever published last, which on this repository is normally a main
# build; link to a curated release by its own tag.
#
# Cut one with scripts/release.sh, which checks the working tree and the tag format for you.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # gh release create

# One run per tag. Tags are unique, so this is not about ordinary pushes racing — it is about a tag
# that gets deleted and re-pushed, or a re-run started while the original is still going, ending with
# two runs calling `gh release create` on the same name. Never cancel-in-progress: a run interrupted
# between the release being created and its assets being uploaded leaves a published release with
# nothing attached, which is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can be pushed at any commit, including one that never went through a pull request.
  # Everything downstream assumes otherwise: the device matrix below is chosen to complement what
  # ci.yml already ran on this commit and skips whole API levels on that basis, so a tag off main
  # would be tested by three devices in total rather than six. `on: push: tags` cannot express a
  # branch filter, so the check has to be a job — and it has to come first, before the run spends
  # Test Lab quota that a bad tag can never earn back.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ancestry, so the whole history rather than the tagged commit alone
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          # The checkout leaves the runner on a detached tag with no branch refs guaranteed, so fetch
          # main explicitly rather than trusting one to be there.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at ${GITHUB_SHA::7}, which is not on main. Tags are cut from main only — move the tag and push it again."
            exit 1
          fi

  # A second instrumented pass, on three devices ci.yml never runs. The tag always points at a commit
  # that already went green on main, so repeating that matrix would say nothing new — every device
  # here is chosen for what the CI three do not carry:
  #   MediumPhone.arm 30 — phone layout at minSdk, which ci.yml gives up when it pairs API 30 with
  #     the small phone to save an execution. A release is where that gap is worth closing.
  #   MediumTablet.arm 35 — a large screen, which nothing in ci.yml covers at all.
  #   tangorpro 36 — a physical Pixel Tablet: real silicon and a large screen at once, which no
  #     other device in either workflow has together.
  #
  # Quota: 2 virtual + 1 physical, on top of the 2 + 1 the same commit already spent landing on main.
  # The Spark plan allows 10 and 5 a Pacific day, so a tag only runs dry on a day that already saw
  # four pushes to main. If that happens the tag exists but nothing publishes — re-run this job the
  # next day and the release follows; the tag never needs to move.
  testlab:
    needs: [guard]   # never spend an execution on a tag that is not on main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:android:assembleDebug :app:android:assembleDebugAndroidTest

      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/firebase-sa.json"
          gcloud config set project abit-kmp
          gcloud firebase test android run --type instrumentation \
            --app app/android/build/outputs/apk/debug/android-debug.apk \
            --test app/android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=30 \
            --device model=MediumTablet.arm,version=35 \
            --device model=tangorpro,version=36 \
            --timeout 20m \
            --num-flaky-test-attempts 1

  # The version, in the two pieces the build wants and the one the release page wants. A tag fixes
  # the base — v1.3 means baseVersion 1.3 — so unlike ci.yml's copy this one has nothing to guess;
  # what it still needs the whole history for is the commit count and the previous release.
  version:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.compute.outputs.base }}
      number: ${{ steps.compute.outputs.number }}
      name: ${{ steps.compute.outputs.name }}
      previous: ${{ steps.compute.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: compute
        run: |
          set -euo pipefail
          BASE="${GITHUB_REF_NAME#v}"
          NUMBER=$(git rev-list --count HEAD)
          # From the tag's parent, so the tag being cut is not its own predecessor. Either kind of
          # tag counts: the changelog should cover what has happened since the last publish, and on
          # this repository that is almost always a build-N release rather than the previous v.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' --match 'build-*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "base=$BASE"
            echo "number=$NUMBER"
            echo "name=$BASE.$NUMBER"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

  # The same four platforms ci.yml builds, from the same workflow, with the same names. A tagged
  # release and the main-push release before it differ in their notes and in nothing else.
  binaries:
    needs: [version, testlab]
    uses: ./.github/workflows/binaries.yml
    secrets: inherit
    with:
      base-version: ${{ needs.version.outputs.base }}
      build-number: ${{ needs.version.outputs.number }}

  release:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the notes are a git log, and PREVIOUS is a tag

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # scripts/publish-release.sh is shared with ci.yml. The tag already exists here, so `gh release
      # create` attaches the release to it rather than creating it; --target naming the same commit
      # the tag points at is a no-op, not a move.
      - name: Publish the GitHub Release
        run: scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: v${{ needs.version.outputs.name }}
          RELEASE_VERSION: ${{ needs.version.outputs.name }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
