name: Release

# Only a manually pushed v* tag publishes to the Releases page — that is what keeps it a curated
# archive rather than a build log. Continuous delivery to testers is ci.yml's distribute job; a tag
# feeds the same App Distribution channel as well, so testers who are behind get offered the
# tag-named build rather than one named under the previous tag.
#
# Cut one with scripts/release.sh, which checks the working tree and the tag format for you.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # gh release create

# One run per tag. Tags are unique, so this is not about ordinary pushes racing — it is about a tag
# that gets deleted and re-pushed, or a re-run started while the original is still going, ending with
# two runs calling `gh release create` on the same name. Never cancel-in-progress: a run interrupted
# between the release being created and its assets being uploaded leaves a published release with
# nothing attached, which is worse than waiting.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can be pushed at any commit, including one that never went through a pull request.
  # Everything downstream assumes otherwise: the device matrix below is chosen to complement what
  # ci.yml already ran on this commit and skips whole API levels on that basis, so a tag off main
  # would be tested by three devices in total rather than six. `on: push: tags` cannot express a
  # branch filter, so the check has to be a job — and it has to come first, before the run spends
  # Test Lab quota that a bad tag can never earn back.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ancestry, so the whole history rather than the tagged commit alone
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          # The checkout leaves the runner on a detached tag with no branch refs guaranteed, so fetch
          # main explicitly rather than trusting one to be there.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at ${GITHUB_SHA::7}, which is not on main. Tags are cut from main only — move the tag and push it again."
            exit 1
          fi

  # A second instrumented pass, on three devices ci.yml never runs. The tag always points at a commit
  # that already went green on main, so repeating that matrix would say nothing new — every device
  # here is chosen for what the CI three do not carry:
  #   MediumPhone.arm 30 — phone layout at minSdk, which ci.yml gives up when it pairs API 30 with
  #     the small phone to save an execution. A release is where that gap is worth closing.
  #   MediumTablet.arm 35 — a large screen, which nothing in ci.yml covers at all.
  #   tangorpro 36 — a physical Pixel Tablet: real silicon and a large screen at once, which no
  #     other device in either workflow has together.
  #
  # Quota: 2 virtual + 1 physical, on top of the 2 + 1 the same commit already spent landing on main.
  # The Spark plan allows 10 and 5 a Pacific day, so a tag only runs dry on a day that already saw
  # four pushes to main. If that happens the tag exists but nothing publishes — re-run this job the
  # next day and the release follows; the tag never needs to move.
  testlab:
    needs: [guard]   # never spend an execution on a tag that is not on main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:android:assembleDebug :app:android:assembleDebugAndroidTest

      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/firebase-sa.json"
          gcloud config set project abit-kmp
          gcloud firebase test android run --type instrumentation \
            --app app/android/build/outputs/apk/debug/android-debug.apk \
            --test app/android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=30 \
            --device model=MediumTablet.arm,version=35 \
            --device model=tangorpro,version=36 \
            --timeout 20m \
            --num-flaky-test-attempts 1

  build-android:
    needs: [testlab]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # versionCode is the commit count
          lfs: true        # the release build packages the LFS-tracked baseline profile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore secrets
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KOTZILLA_JSON_BASE64: ${{ secrets.KOTZILLA_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: scripts/restore-secrets.sh

      # versionName is <tag>.<versionCode>, the same rule the App Distribution builds follow, so a
      # release needs no edit to any build file and the tag can never drift from what the APK says.
      - name: Build the signed release APKs
        run: |
          ./gradlew :app:android:assembleRelease :app:wear:assembleRelease \
            -PbuildNumber="$(git rev-list --count HEAD)" \
            -PbaseVersion="${GITHUB_REF_NAME#v}"

      # The mappings are not optional: R8 is on, so without the file from this exact build no crash
      # report from this release can be read. Crashlytics holds its own copy; these are for anyone
      # reading a stack trace out of a GitHub issue.
      - name: Collect the artifacts
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}.$(git rev-list --count HEAD)"
          mkdir -p artifacts
          cp app/android/build/outputs/apk/release/android-release.apk "artifacts/abit-$V.apk"
          cp app/wear/build/outputs/apk/release/wear-release.apk "artifacts/abit-wear-$V.apk"
          cp app/android/build/outputs/mapping/release/mapping.txt "artifacts/mapping-android-$V.txt"
          cp app/wear/build/outputs/mapping/release/mapping.txt "artifacts/mapping-wear-$V.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: artifacts/*
          if-no-files-found: error

  # macOS is the only runner that can package or notarize a DMG.
  build-desktop:
    needs: [guard]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # packageVersion is derived from the tag and the commit count
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      # Signing is gated on the secrets existing, because the Apple Developer Program is not paid for
      # yet. With no certificate the DMG is built unsigned and macOS shows the Gatekeeper warning; the
      # release notes say so. When the certificate exists, adding these three secrets is the whole
      # change — no code moves.
      # The condition is on env rather than on `secrets` directly: GitHub does not allow the
      # secrets context inside an `if`, so the value has to be carried through the environment.
      - name: Import the Apple signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_P12_BASE64:-}" ]; then
            echo "No Apple signing certificate configured — the DMG will be unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # notarizeReleaseDmg when the Apple secrets are present, packageReleaseDmg when they are not.
      # Notarization submits the bundle to Apple and waits, which is why this job's timeout is
      # generous. Both are the `release` build type, the one ProGuard shrinks — `packageDmg` would
      # ship the unminified bundle, which is 25 MB larger and is not what CI proved on this commit.
      - name: Package the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          set -euo pipefail
          TASK=packageReleaseDmg
          if [ -n "${NOTARIZATION_TEAM_ID:-}" ]; then TASK=notarizeReleaseDmg; fi
          echo "Running :app:desktop:$TASK"
          ./gradlew ":app:desktop:$TASK" \
            -PbuildNumber="$(git rev-list --count HEAD)" \
            -PbaseVersion="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-release
          path: app/desktop/build/compose/binaries/main*/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # Deliberately before the Releases step: re-uploading the same binary is deduplicated by
      # Firebase, while `gh release create` fails once the release exists — so with this order a
      # failed run can simply be re-run.
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          V="${GITHUB_REF_NAME#v}.$(git rev-list --count HEAD)"
          # The full version, then every commit subject since the previous tag — the same ground
          # --generate-notes covers on the release page. The first tag has no predecessor, in which
          # case the whole history is the changelog.
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          NOTES="v$V"$'\n\n'"$(git log ${PREV:+$PREV..}HEAD --pretty='- %s')"
          npx --yes firebase-tools@15 appdistribution:distribute \
            "artifacts/abit-$V.apk" \
            --app 1:335064890942:android:401a22493684705bb71b6f \
            --groups testers \
            --release-notes "$NOTES"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}.$(git rev-list --count HEAD)"
          # An unsigned DMG is a fact testers need before they download it, not after.
          NOTE=""
          if [ -z "${NOTARIZATION_TEAM_ID:-}" ]; then
            NOTE=$'> The macOS app is **not signed or notarized** yet. macOS will refuse to open it on a double click — right-click the app and choose Open, once.\n\n'
          fi
          NOTE+=$'The Wear OS app is sideloaded: `adb install abit-wear-'"$V"$'.apk`.\n'
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "v$V" \
            --notes "$NOTE" \
            --generate-notes
