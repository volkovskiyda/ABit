name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pull request runs are cancelled; main runs are never cancelled. A main run publishes a
# release now, and cancelling one part-way through can leave a release with half its assets attached,
# or a Hosting deploy with no release to match it. Two main pushes in quick succession therefore cost
# two full runs — which is the cheaper of the two problems.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that needs nothing but a JDK. It deliberately runs with no secrets restored, which
  # makes it the standing proof that a fresh clone of this public repository builds: no signing
  # config, no Kotzilla keys, no google-services.json, and still green.
  #
  # `ubuntu-24.04` rather than `ubuntu-latest`, and the same everywhere else in these four workflows:
  # `ubuntu-latest` becomes Ubuntu 26.04 over November 2026, which would move the image — the Android
  # SDK, the emulator's host libraries, the gcloud build — under a green pipeline with nothing in the
  # history saying so. macos-15 was already pinned for that reason; this makes Linux agree. Bumping it
  # is a one-line commit that gets its own CI run, which is the point.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true   # the screenshot goldens are LFS objects (.gitattributes)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21   # LTS, and what gradle/gradle-daemon-jvm.properties pins
      - uses: gradle/actions/setup-gradle@v5   # caching + wrapper validation

      # detekt, ktlint, Android lint, unit tests on both JVM hosts, the desktop UI tests and the
      # screenshot goldens. None of the three analysers carries a baseline, by design: a finding
      # fails the build. Fix the finding, don't generate a baseline. ktlint's half is `ktlintFormat`.
      - run: scripts/run-tests.sh

      - run: ./gradlew :app:android:assembleDebug :app:wear:assembleDebug :app:web:wasmJsBrowserDistribution

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  # The instrumented suite, on an emulator Gradle downloads and boots itself. This runs on every
  # pull request, which Jellyshelf cannot afford: its APK is arm64-only, so it has to spend Firebase
  # Test Lab quota for any device at all. Nothing here is arm64-only, so a free x86_64 runner does it.
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Without KVM the x86_64 emulator falls back to software virtualisation and never finishes
      # booting inside the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v5

      # The `ci` device group, defined in build-logic — so changing the matrix is a code change
      # rather than a workflow edit.
      - run: ./gradlew ciGroupDebugAndroidTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: instrumented-reports
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore

  # The Firestore security rules, attempted for real against the local emulator. These are the one
  # artefact in the project that fails silently and expensively — a wrong rule exposes one user's
  # data to another without breaking anything — so they get their own job.
  emulator-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v5

      # Needs no Firebase login: --project names a project id, it does not contact it.
      - run: scripts/emulator-tests.sh

  # macOS is the only runner that can package a DMG, and its minutes cost ten times a Linux one's —
  # so this builds the bundle to prove it still packages, and leaves signing to the release workflow.
  #
  # `packageReleaseDmg`, not `packageDmg`: the release build type is the one ProGuard runs over, and
  # a missing keep rule does not fail the build — it fails the app, on the one code path that needed
  # the class. Building the minified bundle on every push is what makes that a CI failure rather
  # than a tester's crash report at tag time.
  #
  # It runs on main pushes too, even though the binaries workflow below packages the same DMG for
  # real a few jobs later. The two are not the same question. This one has no `needs`, so it answers
  # "does the minified bundle still package?" in ten minutes and on every commit; the one below is
  # gated on the whole test suite including Test Lab, which is metered, so on a day that has run out
  # of quota it never runs at all — and a keep rule that went missing on that commit would reach a
  # tag unchallenged. A macOS runner is free on a public repository and this one is off the critical
  # path, which is a small price for the guarantee.
  desktop:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:desktop:test :app:desktop:packageReleaseDmg

      - uses: actions/upload-artifact@v7
        with:
          name: abit-desktop-unsigned
          path: app/desktop/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  # Real hardware and older API levels, which no emulator covers. Main pushes only: Test Lab is
  # metered, and a pull request already gets the managed-emulator run above.
  testlab:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, instrumented]
    runs-on: ubuntu-24.04
    # Has to clear the matrix's own --timeout plus the build ahead of it. Any tighter and a test that
    # actually reached its Test Lab bound would be killed here first: the job would read as cancelled
    # rather than failed, the matrix would carry on in the cloud unwatched, and the executions would
    # be spent with nothing to show for them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew :app:android:assembleDebug :app:android:assembleDebugAndroidTest

      - name: Run instrumented tests on Test Lab
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret (see docs/RELEASING.md)}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/firebase-sa.json"
          gcloud config set project abit-kmp
          # Three devices, each carrying something the others do not, and no two overlapping on any
          # axis — API level, page size, emulated versus real silicon. They run in parallel, so the
          # matrix costs the slowest one rather than the sum.
          #   MediumPhone.arm 30 — the phone shape at minSdk, which is the floor both apps declare.
          #   MediumPhone_ps16k.arm 36 — the same phone at the level most installs actually run, on
          #     a 16 KB page-size image: what every device shipping with Android 15 and later uses,
          #     and the only thing in either workflow that answers whether the native libraries the
          #     app pulls in — Room's bundled SQLite, Firebase — are aligned for it. The vendor tags
          #     it `preview=36`; if it ever leaves `models list`, MediumPhone.arm 36 is the fallback
          #     and only that one axis goes with it.
          #   tokay 36 — a physical Pixel 9: real silicon, real GPU, real timings. No emulator
          #     exercises the hardware paths, and Compose rendering is exactly where that shows.
          #
          # No small phone in either workflow any more. The 360 x 640 dp screen it carried is asked
          # on every pull request by the `smallPhoneApi35Atd` managed device in the `ci` group and
          # again by the screenshot goldens, both of which run on a free runner — so the execution
          # was buying a duplicate at the one price Test Lab actually charges. Note there is no
          # LargePhone.arm to reach for: MediumPhone.arm is the only generic virtual phone the
          # catalogue offers above API 35.
          #
          # Quota is what fixes the size at three. The Spark plan allows ten virtual and five
          # physical device executions per Pacific day, counted per device, so two virtual and one
          # physical a run means five pushes to main in a day with neither bucket running out ahead
          # of the other. A fourth device costs two pushes a day whichever kind it is.
          # `gcloud alpha services quota list --service=testing.googleapis.com` prints the live
          # numbers; `gcloud firebase test android models list` prints what is available.
          gcloud firebase test android run --type instrumentation \
            --app app/android/build/outputs/apk/debug/android-debug.apk \
            --test app/android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=30 \
            --device model=MediumPhone_ps16k.arm,version=36 \
            --device model=tokay,version=36 \
            --timeout 20m \
            --num-flaky-test-attempts 1

  # The version, computed once and handed to everything below it. It is the only job here that needs
  # the whole history: versionCode is the commit count and baseVersion is the latest v-tag reachable
  # from HEAD, so a main build reports 1.3.348 — the same shape the tag v1.3 itself will publish —
  # and nothing in the repository is edited per release.
  #
  # The --match 'v*' is not decoration. Every push now leaves a build-N tag behind, and a bare
  # `git describe` would happily return one of those and hand the build a baseVersion of "build-347".
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, instrumented, emulator-tests, testlab]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.compute.outputs.base }}
      number: ${{ steps.compute.outputs.number }}
      name: ${{ steps.compute.outputs.name }}
      previous: ${{ steps.compute.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: compute
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v1.0)
          NUMBER=$(git rev-list --count HEAD)
          # The nearest published tag of either kind — the last thing anyone could actually download.
          # Empty on the very first run, and then the notes are the whole history, which is correct.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' --match 'build-*' HEAD 2>/dev/null || true)
          {
            echo "base=${TAG#v}"
            echo "number=$NUMBER"
            echo "name=${TAG#v}.$NUMBER"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

  # Phone, watch, Mac and web, all four from the same commit. Pull requests never reach it: `version`
  # is skipped for them, and a skipped dependency skips everything downstream.
  binaries:
    needs: [version]
    uses: ./.github/workflows/binaries.yml
    secrets: inherit
    with:
      base-version: ${{ needs.version.outputs.base }}
      build-number: ${{ needs.version.outputs.number }}

  # Every green main push becomes a downloadable release, with no manual step.
  #
  # It is a full release — not a pre-release — tagged build-<versionCode>, so `releases/latest`
  # resolves to the newest main build and a link to "the latest version" follows main rather than the
  # last curated tag. A v-tag still publishes its own release, with its own title and a second Test
  # Lab matrix behind it; what it no longer is, is the permanent "latest" pointer.
  #
  # One release per build, never a single rolling release that overwrites itself: the Releases page
  # is the archive, and a build's R8 mappings are the only way to read a crash report from it. A
  # rolling release would lose the mapping for build N the moment N+1 landed.
  publish:
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # gh release create, and the tag it creates with it
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the notes are a git log, and PREVIOUS is a tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Only the three release artifacts. Without the pattern this downloads every artifact of the
      # run, and on a main push that includes abit-desktop-unsigned — the smoke DMG the desktop job
      # above packages with no build number — which then ships on the release as ABit-1.0.1.dmg next
      # to the real one.
      #
      # v8 fails the step when a download's digest does not match the one the server recorded, where
      # v6 only logged it. That is the behaviour this job wants: what it downloads here is what gets
      # published and deployed, and a silently truncated APK would reach the release page.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*-release'
          merge-multiple: true

      # The web app and the security rules ship together, deliberately: a rule change that a client
      # change depends on must never lag behind it. Hosting gets the bytes out of the zip the release
      # carries rather than a rebuild, so what is deployed and what is downloadable are the same
      # build and not merely the same commit.
      #
      # Deliberately before the release step, for the same reason the App Distribution upload used to
      # come first: a deploy is idempotent and `gh release create` fails once the release exists, so
      # with this order a half-finished run can simply be re-run.
      - name: Deploy the web app and the Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?set the FIREBASE_SERVICE_ACCOUNT repository secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          DIST=app/web/build/dist/wasmJs/productionExecutable
          mkdir -p "$DIST"
          unzip -q "artifacts/abit-web-${{ needs.version.outputs.name }}.zip" -d "$DIST"
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project abit-kmp

      # The script is shared with release.yml, so a change to what a release says lands on both
      # channels at once. Everything it needs comes through the environment.
      - name: Publish the release
        run: scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          RELEASE_TAG: build-${{ needs.version.outputs.number }}
          RELEASE_TITLE: ${{ needs.version.outputs.name }}
          RELEASE_VERSION: ${{ needs.version.outputs.name }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
