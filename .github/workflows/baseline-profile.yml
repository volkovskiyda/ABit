name: Baseline profile

# Regenerating the profile is a deliberate act, not something a push should do: it changes a 24k-line
# committed artefact that affects every user's first launch, and it deserves to be looked at. So this
# is dispatch-only, and it opens a pull request rather than pushing to main.
#
# Run it when the startup path changes shape — a new first screen, a different dependency graph at
# launch — which is a handful of times a year rather than once per release.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baseline-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true   # the existing profile is an LFS object, and the task rewrites it

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Without KVM the x86_64 emulator falls back to software virtualisation and never finishes
      # booting inside the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v5

      # Downloads and boots the managed device itself; no AVD setup and no connected hardware.
      - name: Generate the baseline profile
        run: ./gradlew :app:android:generateReleaseBaselineProfile

      - name: Open a pull request with the result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- app/android/src/release/generated/baselineProfiles; then
            echo "The profile is unchanged — nothing to review."
            exit 0
          fi
          BRANCH="baseline-profile/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add app/android/src/release/generated/baselineProfiles
          git commit -m "perf: regenerate the baseline profile"
          git push --set-upstream origin "$BRANCH"
          gh pr create --fill --title "perf: regenerate the baseline profile" --body "$(cat <<'BODY'
          Generated by the baseline-profile workflow on a Gradle-managed Pixel 6 (API 35, AOSP).

          Before merging, check that the diff is plausible: the profile should still be mostly
          AndroidX and Compose with a few hundred lines of this app's own classes, and it should not
          have shrunk dramatically — a much smaller profile usually means the generator stopped at
          the splash screen instead of waiting for real content.
          BODY
          )"
