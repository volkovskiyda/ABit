<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ABit</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#DCE3F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#2E3444" media="(prefers-color-scheme: dark)">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Matches the Material surface the app paints, so the page does not flash white
               while the wasm bundle loads. */
            background-color: #F7F8FC;
        }

        @media (prefers-color-scheme: dark) {
            html, body {
                background-color: #151A28;
            }
        }
    </style>
    <!-- Google Identity Services, for the Google sign-in in Settings. `async defer` so it never
         delays the wasm bundle: the shim in web/auth/GoogleSignIn.kt checks that it has loaded and
         reports sign-in unavailable until it has, which is also the state a blocked or offline
         load leaves the page in. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="application/javascript" src="abit.js"></script>
</head>
<body></body>
</html>
