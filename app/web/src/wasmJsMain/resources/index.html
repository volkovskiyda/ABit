<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ABit</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Matches the Material surface the app paints, so the page does not flash white
               while the wasm bundle loads. */
            background-color: #FFFBFF;
        }

        @media (prefers-color-scheme: dark) {
            html, body {
                background-color: #1C1B1F;
            }
        }
    </style>
    <script type="application/javascript" src="abit.js"></script>
</head>
<body></body>
</html>
