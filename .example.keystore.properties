# Copy to keystore.properties (git-ignored) and fill in to sign release builds.
#
# Without the real file `assembleRelease` still works — it simply produces an unsigned APK, which is
# what a fresh clone and a fork's pull request want. Only the delivery workflows restore it, from the
# KEYSTORE_PROPERTIES_BASE64 secret.
#
# The keystore itself sits beside this file at the repository root and is git-ignored too (*.jks).
# It is PKCS12 (keytool's default), so the key password is the store password and there is no
# separate entry for it.
KEYSTORE_FILE=abit-release.jks
KEYSTORE_PASSWORD=your-keystore-password
KEY_ALIAS=abit
