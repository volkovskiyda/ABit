# Copy to oauth.properties (git-ignored) to enable Google sign-in in the macOS app.
#
# Without the real file `:app:desktop:run` and `packageReleaseDmg` still work — Google sign-in simply
# reports itself unavailable in the popover and anonymous sign-in carries the app, which is what a
# fresh clone and a fork's pull request want. Only the release workflow restores it, from the
# OAUTH_PROPERTIES_BASE64 secret.
#
# Create the client in the Google Cloud console for project abit-kmp:
#   APIs & Services → Credentials → Create credentials → OAuth client ID → Desktop app
# It needs no redirect URI of its own: a Desktop-app client accepts any http://127.0.0.1 port, which
# is what the loopback flow binds. The OAuth consent screen has to be configured first.
#
# This is a **Desktop app** client, not the web one. Google's own documentation says the secret it
# issues for an installed app is not treated as confidential — an app on someone's machine cannot
# keep one — and PKCE is what actually secures the exchange. The web client's secret is genuinely
# confidential and must never be shipped inside a DMG.
DESKTOP_CLIENT_ID=000000000000-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.apps.googleusercontent.com
DESKTOP_CLIENT_SECRET=GOCSPX-your-desktop-client-secret
